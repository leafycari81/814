<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>814 表現紀錄</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#c67139">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="814 表現">
<style>
  html, body { margin: 0; height: 100%; background: #f5ead8; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<iframe src="app.html" title="814 表現紀錄" allow="fullscreen"></iframe>
<div id="upd" style="display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;background:#c67139;color:#f5ead8;border-radius:999px;padding:13px 22px;font:700 15px/1 system-ui,-apple-system,'Noto Sans TC',sans-serif;box-shadow:0 6px 20px rgba(46,43,37,.28);cursor:pointer">有新版本，點此更新</div>
<script>
  (function () {
    if (!('serviceWorker' in navigator) || location.protocol.indexOf('http') !== 0) return;
    var toast = document.getElementById('upd'), waiting = null;
    toast.addEventListener('click', function () {
      if (waiting) waiting.postMessage('skipWaiting');
      location.reload();
    });
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!window.__reloaded) { window.__reloaded = true; location.reload(); }
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        function offer(sw) { waiting = sw; toast.style.display = 'block'; }
        if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) offer(sw);
          });
        });
        setInterval(function () { reg.update().catch(function () {}); }, 60000);
      }).catch(function () {});
    });
  })();
</script>
</body>
</html>
