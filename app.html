  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 99 02Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-700);line-height:1.6\">嘉獎：累積本週表現良好每 5 週記一支。警告於段考時按「段考結算警告」手動結算：自上次結算後，未寫作業 10 次以上、上課干擾秩序 5 次以上、不當言語 5 次以上，各記一支警告。橘色數字代表本段已達警告標準。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRewards }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;min-height:0;display:flex\">\n        <section style=\"width:330px;flex:none;border-right:1px solid var(--color-divider);overflow:auto;padding:16px 16px 20px\">\n          <h5 style=\"margin:0 0 10px;font-size:15px\">點數排行<\u002Fh5>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <sc-for list=\"{{ pointList }}\" as=\"p\" hint-placeholder-count=\"29\">\n              <button sc-camel-on-click=\"{{ p.onSelect }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);background:{{ p.bg }};border:1.5px solid {{ p.border }};min-height:44px\">\n                <span style=\"font-size:11px;color:var(--color-neutral-600);width:22px;font-weight:700\">{{ p.rank }}<\u002Fspan>\n                <span style=\"font-size:15px;font-weight:700;flex:1\">{{ p.name }}<\u002Fspan>\n                <span style=\"font-family:'Noto Serif TC',serif;font-weight:700;font-size:17px\">{{ p.points }}<\u002Fspan>\n                <span style=\"font-size:11px;color:var(--color-neutral-600)\">點<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"flex:1;min-width:0;overflow:auto;padding:20px 24px\">\n          <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:20px 24px;display:flex;align-items:center;gap:20px\">\n            <div><div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--color-accent-2-800)\">兌換對象<\u002Fdiv><h4 style=\"margin:2px 0 0;font-size:24px\">{{ sel.name }}<\u002Fh4><\u002Fdiv>\n y\" style=\"border-radius:999px;min-height:42px;font-size:14px\">{{ settleLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px\">\n            <sc-for list=\"{{ rewards }}\" as=\"w\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:16px 18px;display:flex;align-items:center;gap:14px\">\n                <div style=\"flex:1\"><div style=\"font-size:16px;font-weight:700\">{{ w.name }}<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:2px\">{{ w.desc }}<\u002Fdiv><\u002Fdiv>\n                <div style=\"font-family:'Noto Serif TC',serif;font-weight:700;font-size:20px\">{{ w.cost }}<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ w.onRedeem }}\" style=\"all:unset;cursor:{{ w.cursor }};padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;background:{{ w.bg }};color:{{ w.fg }};min-height:40px;display:flex;align-items:center\">{{ w.label }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;font-size:12.5px;color:var(--color-neutral-700)\">點數僅用於班級獎勵，與期末日常表現獎懲分開計算。<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ detail }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onCloseDetail }}\" style=\"position:fixed;inset:0;background:color-mix(in srgb, #2e2b25 42%, transparent);display:flex;align-items:center;justify-content:center;padding:40px;z-index:50\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:560px;max-height:82vh;overflow:auto;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 28px;animation:rise .22s ease\">\n        <div style=\"display:flex;align-items:flex-start;gap:14px\">\n          <div><div style=\"font-size:12px;letter-spacing:.1em;color:var(--color-neutral-700);font-weight:700\">{{ weekLabel }}<\u002Fdiv><h4 style=\"margin:2px 0 0;font-size:26px\">{{ detail.title }}<\u002Fh4><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onCloseDetail }}\" class=\"btn btn-secondary\" style=\"margin-left:auto;border-radius:999px\">關閉<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin:18px 0 6px\">\n          <div style=\"flex:1;background:var(--color-accent-2-200);border-radius:var(--radius-md);padding:11px 14px\"><div style=\"font-size:11.5px;font-weight:700\">本週優點<\u002Fdiv><div style=\"font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700\">{{ detail.good }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;background:var(--color-accent-200);border-radius:var(--radius-md);padding:11px 14px\"><div style=\"font-size:11.5px;font-weight:700\">本週缺點<\u002Fdiv><div style=\"font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700\">{{ detail.total }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;background:var(--color-neutral-200);border-radius:var(--radius-md);padding:11px 14px\"><div style=\"font-size:11.5px;font-weight:700\">學期嘉獎/警告<\u002Fdiv><div style=\"font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700\">{{ detail.meritText }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--color-neutral-700);margin:16px 0 8px\">本週明細<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ detail.entries }}\" as=\"e\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:10px;align-items:center;background:var(--color-neutral-100);border-radius:var(--radius-sm);padding:9px 12px;opacity:{{ e.op }}\">\n              <span style=\"font-size:12px;color:var(--color-neutral-700);width:58px\">{{ e.day }}<\u002Fspan>\n              <span style=\"font-size:14px;font-weight:700;flex:1;text-decoration:{{ e.strike }}\">{{ e.catLabel }}<\u002Fspan>\n              <span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ e.note }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ e.onToggle }}\" style=\"all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:{{ e.actBg }};min-height:32px;display:flex;align-items:center\">{{ e.actLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ detail.empty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:18px;text-align:center;font-size:13px;color:var(--color-neutral-600)\">本週零缺點<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hd }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onCloseHd }}\" style=\"position:fixed;inset:0;background:color-mix(in srgb, #2e2b25 42%, transparent);display:flex;align-items:center;justify-content:center;padding:40px;z-index:50\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:600px;max-height:82vh;overflow:auto;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 28px\">\n        <div style=\"display:flex;align-items:flex-start;gap:14px\">\n          <div><div style=\"font-size:12px;letter-spacing:.1em;color:var(--color-neutral-700);font-weight:700\">歷史紀錄 · 累計 {{ hd.count }} 次<\u002Fdiv><h4 style=\"margin:2px 0 0;font-size:26px\">{{ hd.title }}<\u002Fh4><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onCloseHd }}\" class=\"btn btn-secondary\" style=\"margin-left:auto;border-radius:999px\">關閉<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:18px\">\n          <sc-for list=\"{{ hd.entries }}\" as=\"e\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:12px;align-items:center;background:var(--color-neutral-100);border-radius:var(--radius-sm);padding:9px 12px;opacity:{{ e.op }}\">\n              <span style=\"font-size:12.5px;color:var(--color-neutral-700);width:92px;flex:none\">{{ e.when }}<\u002Fspan>\n              <span style=\"font-size:14px;font-weight:700;width:64px;flex:none;text-decoration:{{ e.strike }}\">{{ e.sub }}<\u002Fspan>\n              <span style=\"font-size:13px;flex:1;text-decoration:{{ e.strike }}\">{{ e.content }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ e.onToggle }}\" style=\"all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:{{ e.actBg }};min-height:32px;display:flex;align-items:center\">{{ e.actLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ hd.hasOlder }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:10px 12px;font-size:12.5px;color:var(--color-neutral-700);line-height:1.6;background:var(--color-neutral-200);border-radius:var(--radius-sm)\">另有 {{ hd.older }} 次是這個功能上線前就已清空的紀錄，只保留次數，沒有明細。<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ warnOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onCloseWarn }}\" style=\"position:fixed;inset:0;background:color-mix(in srgb, #2e2b25 42%, transparent);display:flex;align-items:center;justify-content:center;padding:40px;z-index:50\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:540px;max-height:82vh;overflow:auto;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 28px\">\n        <h4 style=\"margin:0;font-size:24px\">段考結算警告<\u002Fh4>\n        <p style=\"margin:8px 0 14px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.7\">{{ warnSince }}<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ warnPreview }}\" as=\"w\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:12px;align-items:center;background:var(--color-accent-100);border-radius:var(--radius-sm);padding:9px 12px\">\n              <span style=\"font-size:14px;font-weight:700;width:96px;flex:none\">{{ w.name }}<\u002Fspan>\n              <span style=\"font-size:13px;flex:1\">{{ w.reason }}<\u002Fspan>\n              <span style=\"font-size:13px;font-weight:700;color:var(--color-accent-800)\">警告 {{ w.n }} 支<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ warnNone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px;text-align:center;font-size:13px;color:var(--color-neutral-700);background:var(--color-neutral-100);border-radius:var(--radius-sm)\">本段沒有學生達到警告標準<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:20px\">\n          <button sc-camel-on-click=\"{{ onCloseWarn }}\" class=\"btn btn-secondary\" style=\"flex:1;border-radius:999px;min-height:48px\">取消<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onConfirmWarn }}\" class=\"btn btn-primary\" style=\"flex:1;border-radius:999px;min-height:48px\">確認結算<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:12px;color:var(--color-neutral-700);line-height:1.6\">結算後，下次結算會從今天重新計次。按錯可用左下角「回到上一步」收回。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n\n  <sc-if value=\"{{ pickOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onClosePick }}\" style=\"position:fixed;inset:0;background:color-mix(in srgb, #2e2b25 42%, transparent);display:flex;align-items:center;justify-content:center;padding:40px;z-index:58\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:520px;max-height:86vh;overflow:auto;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 28px;animation:rise .22s ease\">\n        <h4 style=\"margin:0;font-size:23px\">選一筆要銷掉的缺點<\u002Fh4>\n        <p style=\"margin:8px 0 16px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.75\">{{ pickName }} 兌換「銷缺點」（−{{ pickCost }} 點）。點選下面任一筆，該筆會立刻銷掉並扣點，也不會出現在家長聯繫單上。<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ pickRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ r.onPick }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--radius-md);background:var(--color-neutral-100);border:1.5px solid var(--color-divider)\" style-hover=\"background:var(--color-accent-200);border-color:var(--color-accent-500)\">\n              <span style=\"font-size:15px;font-weight:700\">{{ r.label }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:var(--color-neutral-700)\">{{ r.meta }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:13px;font-weight:700;color:var(--color-accent-700)\">銷掉<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;margin-top:18px\">\n          <button sc-camel-on-click=\"{{ onClosePick }}\" class=\"btn btn-ghost\" style=\"margin-left:auto;min-height:40px\">取消<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ allOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onAllCancel }}\" style=\"position:fixed;inset:0;background:color-mix(in srgb, #2e2b25 42%, transparent);display:flex;align-items:center;justify-content:center;padding:40px;z-index:58\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:440px;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 28px;animation:rise .22s ease\">\n        <h4 style=\"margin:0;font-size:23px\">全班優良<\u002Fh4>\n        <p style=\"margin:8px 0 18px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.75\">週末一次登錄。輸入本週全班優良的次數（一週 35 節課，最多 35 次），一次全班每人加 1 點。<\u002Fp>\n        <sc-if value=\"{{ classgoodWarn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom:14px;padding:10px 14px;border-radius:var(--radius-md);background:var(--color-accent-100);border:1.5px solid var(--color-accent-400);font-size:13px;line-height:1.6\">本週已經登記過 {{ classgoodWeekCount }} 次了，再輸入的次數會「累加」上去，不是取代。若是想修改成正確總數，請先到本週統計點學生名字，把多按的那幾筆銷掉，再用這裡補登差額。<\u002Fdiv>\n        <\u002Fsc-if>\n        <input value=\"{{ allNValue }}\" sc-camel-on-change=\"{{ onAllN }}\" type=\"number\" min=\"1\" max=\"35\" class=\"input\" style=\"width:100%;height:54px;font-size:22px;font-weight:700;border-radius:999px;text-align:center\">\n        <div style=\"font-size:13px;color:var(--color-accent-2-800);font-weight:700;margin-top:12px\">{{ allSummary }}<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:18px\">\n          <button sc-camel-on-click=\"{{ onAllCancel }}\" class=\"btn btn-ghost\" style=\"flex:1;border-radius:999px;min-height:46px;font-size:15px\">取消<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onAllConfirm }}\" class=\"btn btn-primary\" style=\"flex:1;border-radius:999px;min-height:46px;font-size:15px\">登錄<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ planOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onClosePlan }}\" style=\"position:fixed;inset:0;background:color-mix(in srgb, #2e2b25 42%, transparent);display:flex;align-items:center;justify-content:center;padding:40px;z-index:57\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:560px;max-height:88vh;overflow:auto;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 28px;animation:rise .22s ease\">\n        <h4 style=\"margin:0;font-size:23px\">今日要檢查的作業<\u002Fh4>\n        <p style=\"margin:8px 0 16px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.75\">先把今天要檢查的科目與範圍都輸入好，登錄時直接點清單上的項目，不必重打範圍。清單記在今天，隔天自動清空。<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ planRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-md);background:var(--color-neutral-100);border:1.5px solid var(--color-divider)\">\n              <span style=\"font-size:15px;font-weight:700;min-width:56px\">{{ r.sub }}<\u002Fspan>\n              <span style=\"font-size:13.5px;color:var(--color-neutral-800)\">{{ r.range }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ r.onRemove }}\" class=\"btn btn-ghost\" style=\"margin-left:auto;min-height:36px;font-size:13px\">刪除<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ planEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:13px;color:var(--color-neutral-700);padding:6px 0 2px\">清單還是空的。<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"height:1px;background:var(--color-divider);margin:18px 0 14px\"><\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--color-neutral-700);margin-bottom:8px\">新增一項<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px\">\n          <sc-for list=\"{{ planSubjects }}\" as=\"s\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;background:{{ s.bg }};color:{{ s.fg }};border:1.5px solid {{ s.border }};min-height:38px;display:flex;align-items:center\">{{ s.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px\">\n          <sc-if value=\"{{ planOther }}\" hint-placeholder-val=\"{{ false }}\">\n            <input value=\"{{ planOtherValue }}\" sc-camel-on-change=\"{{ onPlanOther }}\" placeholder=\"作業名稱，例如 閱讀心得\" class=\"input\" style=\"width:170px;height:44px;font-size:15px;border-radius:999px\">\n          <\u002Fsc-if>\n          <input value=\"{{ planRangeValue }}\" sc-camel-on-change=\"{{ onPlanRange }}\" placeholder=\"範圍，例如 習作 p.32～35\" class=\"input\" style=\"flex:1;height:44px;font-size:15px;border-radius:999px\">\n          <button sc-camel-on-click=\"{{ onPlanAdd }}\" class=\"btn btn-primary\" style=\"border-radius:999px;min-height:44px;font-size:15px\">加入清單<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:center;margin-top:16px\">\n          <button sc-camel-on-click=\"{{ onPlanClear }}\" class=\"btn btn-secondary\" style=\"border-radius:999px;min-height:40px;font-size:13px\">清空清單<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onClosePlan }}\" class=\"btn btn-ghost\" style=\"margin-left:auto;min-height:40px\">完成<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ io }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onCloseIO }}\" style=\"position:fixed;inset:0;background:color-mix(in srgb, #2e2b25 42%, transparent);display:flex;align-items:center;justify-content:center;padding:40px;z-index:56\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:540px;max-height:88vh;overflow:auto;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 28px;animation:rise .22s ease\">\n        <h4 style=\"margin:0;font-size:23px\">學期設定與備份<\u002Fh4>\n        <div style=\"display:flex;gap:12px;margin:14px 0 6px\">\n          <label style=\"flex:1;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--color-neutral-700)\">開學日（第 1 週的任一天）\n            <input type=\"date\" value=\"{{ semStartValue }}\" sc-camel-on-change=\"{{ onSemStart }}\" class=\"input\" style=\"border-radius:999px;font-size:15px\">\n          <\u002Flabel>\n          <label style=\"flex:1;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--color-neutral-700)\">學期名稱\n            <input type=\"text\" value=\"{{ semName }}\" sc-camel-on-change=\"{{ onSemName }}\" placeholder=\"115 學年度 第二學期\" class=\"input\" style=\"border-radius:999px;font-size:15px\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:20px\">\n          <span style=\"font-size:12.5px;color:var(--color-neutral-700)\">目前：{{ semStartHint }}，開學前顯示「開學預備週」<\u002Fspan>\n          <button sc-camel-on-click=\"{{ onSemSave }}\" class=\"btn btn-primary\" style=\"margin-left:auto;border-radius:999px;min-height:40px;font-size:14px\">套用學期設定<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:var(--color-divider);margin-bottom:18px\"><\u002Fdiv>\n        <h4 style=\"margin:0;font-size:20px\">備份與還原<\u002Fh4>\n        <p style=\"margin:8px 0 14px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.75\">紀錄都存在這台 iPad 上，關掉 App 也不會消失，不需要網路。要換裝置或留一份保險時，按「產生備份碼」把那串文字複製保存；在另一台貼上後按「匯入並覆蓋」即可。目前本機 {{ savedCount }} 筆。<\u002Fp>\n        <div style=\"display:flex;gap:10px;margin-bottom:18px\">\n          <button sc-camel-on-click=\"{{ onBackupFile }}\" class=\"btn btn-primary\" style=\"flex:1;border-radius:999px;min-height:52px;font-size:16px\">備份到檔案<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onRestorePick }}\" class=\"btn btn-secondary\" style=\"flex:1;border-radius:999px;min-height:52px;font-size:16px\">從檔案還原<\u002Fbutton>\n        <\u002Fdiv>\n        <input id=\"restore-file\" sc-camel-on-change=\"{{ onRestoreFile }}\" type=\"file\" accept=\".json,application/json\" style=\"display:none\">\n        <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.7;margin-bottom:18px\">「備份到檔案」會存下一個含全部紀錄（含週考、段考成績）的檔案，可放到檔案 App 或 iCloud。還原時選同一個檔案即可，會覆蓋目前資料。{{ lastBackupText }}<\u002Fdiv>\n        <div style=\"height:1px;background:var(--color-divider);margin-bottom:16px\"><\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--color-neutral-700);margin-bottom:8px\">備份碼（換裝置用，可複製貼上）<\u002Fdiv>\n        <textarea value=\"{{ ioText }}\" sc-camel-on-change=\"{{ onIOText }}\" placeholder=\"按「產生備份碼」後複製，或把另一台的備份碼貼在這裡\" class=\"input\" style=\"width:100%;height:150px;font-size:12px;line-height:1.5;border-radius:var(--radius-md);resize:none;font-family:ui-monospace,monospace\"><\u002Ftextarea>\n        <div style=\"display:flex;gap:10px;margin-top:14px\">\n          <button sc-camel-on-click=\"{{ onExport }}\" class=\"btn btn-secondary\" style=\"flex:1;border-radius:999px;min-height:46px;font-size:15px\">產生備份碼<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onImport }}\" class=\"btn btn-primary\" style=\"flex:1;border-radius:999px;min-height:46px;font-size:15px\">匯入並覆蓋<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:var(--color-divider);margin:20px 0 16px\"><\u002Fdiv>\n        <h4 style=\"margin:0;font-size:20px\">學期紀錄匯出<\u002Fh4>\n        <p style=\"margin:8px 0 14px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.75\">匯出每位學生本學期的加點、缺點各項累計次數、優點、嘉奮與警告、點數與已兑換獎勵，可在 Numbers 或 Excel 打開，當作期末評語的依據。<\u002Fp>\n        <button sc-camel-on-click=\"{{ onExportCsv }}\" class=\"btn btn-secondary\" style=\"width:100%;border-radius:999px;min-height:46px;font-size:15px\">匯出學期紀錄（CSV）<\u002Fbutton>\n        <div style=\"display:flex;gap:10px;align-items:center;margin-top:10px\">\n          <button sc-camel-on-click=\"{{ onDemo }}\" class=\"btn btn-secondary\" style=\"border-radius:999px;min-height:40px;font-size:13px\">載入示範資料<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onCloseIO }}\" class=\"btn btn-ghost\" style=\"margin-left:auto;min-height:40px\">關閉<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ confirm }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onCancelReset }}\" style=\"position:fixed;inset:0;background:color-mix(in srgb, #2e2b25 42%, transparent);display:flex;align-items:center;justify-content:center;padding:40px;z-index:55\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:460px;max-height:88vh;overflow:auto;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 28px;animation:rise .22s ease\">\n        <sc-if value=\"{{ pickStep }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <h4 style=\"margin:0;font-size:23px\">清空優缺點紀錄<\u002Fh4>\n            <p style=\"margin:8px 0 18px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.7\">清空後無法復原，建議先在「本週統計」匯出紙本表格。<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ resetOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--radius-md);background:var(--color-neutral-100);border:1.5px solid var(--color-divider);min-height:44px\" style-hover=\"border-color:var(--color-accent-500);background:var(--color-accent-100)\">\n                  <span style=\"font-size:15px;font-weight:700\">{{ o.label }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:var(--color-neutral-700);margin-left:auto;text-align:right\">{{ o.desc }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onCancelReset }}\" class=\"btn btn-secondary btn-block\" style=\"border-radius:999px;margin-top:14px;min-height:44px\">取消<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ confirmStep }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"display:inline-flex;align-items:center;gap:8px;background:var(--color-accent-200);color:var(--color-accent-800);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;margin-bottom:12px\">再次確認<\u002Fdiv>\n            <h4 style=\"margin:0;font-size:23px\">確定要「{{ pendingLabel }}」？<\u002Fh4>\n            <p style=\"margin:10px 0 20px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.75\">將刪除 {{ pendingCount }}，且無法復原。若只是要取消單筆紀錄，請回到今日紀錄按「銷掉」。<\u002Fp>\n            <div style=\"display:flex;gap:10px\">\n              <button sc-camel-on-click=\"{{ onBackReset }}\" class=\"btn btn-secondary\" style=\"flex:1;border-radius:999px;min-height:46px;font-size:15px\">返回<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onConfirmReset }}\" class=\"btn btn-primary\" style=\"flex:1;border-radius:999px;min-height:46px;font-size:15px\">確定清空<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--color-neutral-900);color:var(--color-neutral-100);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow-md);z-index:60;animation:rise .2s ease\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;autoGoodWeek&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;規則&quot;},&quot;warnThreshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:3,&quot;max&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;規則&quot;},&quot;hwWarnThreshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:5,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;規則&quot;},&quot;showReminder&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;介面&quot;}}\">\nclass Component extends DCLogic {\n  CATS = [\n    { k: 'disrupt', label: '上課干擾秩序', short: '上課干擾秩序' },\n    { k: 'other', label: '上課做其他事', short: '上課做其他事' },\n    { k: 'words', label: '不當言語', short: '不當言語' },\n    { k: 'hw', label: '未寫作業', short: '未寫作業' },\n    { k: 'gear', label: '未帶課本用具', short: '未帶課本用具' },\n    { k: 'book', label: '未抄聯絡簿', short: '未抄寫聯絡簿' },\n    { k: 'journal', label: '未寫札記', short: '未寫札記' },\n    { k: 'clean', label: '未打掃或隨便', short: '未打掃或隨便' },\n    { k: 'misc', label: '其他違規', short: '其他違規' },\n    { k: 'perf', label: '上課表現特優', short: '表現特優', plus: true },\n    { k: 'service', label: '熱心服務', short: '熱心服務', plus: true },\n    { k: 'ontime', label: '準時完成任務', short: '準時完成任務', plus: true },\n    { k: 'cleanwell', label: '打掃認真', short: '打掃認真', plus: true },\n    { k: 'classgood', label: '全班優良', short: '全班優良', plus: true }\n  ];\n  // 'bonus' 是舊版的加值點數，仍併入加點計算\n  PLUS = ['perf', 'service', 'ontime', 'cleanwell', 'classgood', 'bonus'];\n  isPlus(k) { return this.PLUS.indexOf(k) >= 0; }\n  // 每筆加點項目的點數（全班優良只加 1 點）\n  PTS = { classgood: 1 };\n  plusPts(k) { return this.PTS[k] || 2; }\n  NAMES = ['孔佑中','方凱謙','江允翔','江宗融','吳宜鍇','吳杰澄','李易顯','郭品陞','林奕佐','范宥騫','溫建勛','劉昱翔','潘品僑','潘楷學','盧仕愷','謝又新','王品媃','王晨詠','江玥彤','江宥橙','何紹萌','吳苡瑄','周于甯','田曜瑆','張芷榕','郭羽軒','陳映菱','陳穎瑩','陳曦'];\n  WD = ['日','一','二','三','四','五','六'];\n  monday(base) {\n    const n = base || new Date(), dow = n.getDay(), m = new Date(n);\n    m.setHours(0, 0, 0, 0);\n    m.setDate(n.getDate() + (dow === 0 ? -6 : 1 - dow));\n    return m;\n  }\n  weekDays() {\n    const m = this.monday();\n    return [0, 1, 2, 3, 4].map(i => {\n      const d = new Date(m); d.setDate(m.getDate() + i);\n      return this.WD[i + 1] + ' ' + (d.getMonth() + 1) + '/' + d.getDate();\n    });\n  }\n  semStartDate() {\n    const t = (this.state.semStart || '').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n    if (t) return this.monday(new Date(+t[1], +t[2] - 1, +t[3]));\n    const n = new Date();\n    const y = n.getMonth() >= 7 ? n.getFullYear() : n.getFullYear() - 1;\n    return this.monday(new Date(y, 7, 31));\n  }\n  weekInfo() {\n    const m = this.monday(), n = new Date();\n    const sem = this.semStartDate();\n    const wk = Math.round((m - sem) / 604800000) + 1;\n    const fri = new Date(m); fri.setDate(m.getDate() + 4);\n    const name = wk < 1 ? '開學預備週' : '第 ' + wk + ' 週';\n    return {\n      label: name + ' · ' + (m.getMonth() + 1) + '/' + m.getDate() + ' ～ ' + (fri.getMonth() + 1) + '/' + fri.getDate(),\n      date: (n.getMonth() + 1) + ' 月 ' + n.getDate() + ' 日',\n      day: '星期' + this.WD[n.getDay()]\n    };\n  }\n  todayIdx() { const d = new Date().getDay(); return d === 0 || d === 6 ? 4 : d - 1; }\n  // 每次讀取都重算，App 長時間掛著跨日也會跟上今天\n  get DAYS() { return this.weekDays(); }\n  get TODAY() { return this.todayIdx(); }\n  SUBJECTS = ['國文','英語','數學','理化','地理','歷史','公民','其他'];\n  SPEECH = ['髒話','黃腔','其他'];\n  KEY = 'cls814-perf-v1';\n  REWARDS = [\n    { k: 'revoke', name: '銷缺點', desc: '可銷任一缺點', cost: 10 },\n    { k: 'journal1', name: '免寫札記一次', desc: '任一天札記免寫', cost: 50 },\n    { k: 'journalw', name: '免寫札記一週', desc: '整週札記免寫', cost: 100 },\n    { k: 'drink', name: '特調飲料＋期末美言', desc: '814 特調飲料一杯，外加期末評語美言 100 字', cost: 200 }\n  ];\n\n  rng = (() => { let s = 20251120; return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; })();\n\n  students = this.NAMES.map((name, i) => {\n    const r = this.rng;\n    return { id: i + 1, no: i + 1, name, baseGood: 0, baseViol: 0 };\n  });\n\n  state = { tab: 'today', cat: null, log: [], overrides: {}, note: '', filter: 'all', spent: {}, adjust: {}, sel: 1, detail: null, toast: null, reminder: true, seq: 1000, subject: '數學', jday: 4, range: '', viewDay: undefined, confirm: null, pending: null, exams: {}, mid: {}, midWhich: 0 };\n\n  examCsv() {\n    const w = this.examWeek();\n    const cols = [];\n    for (let i = 0; i < this.EXAM_N; i++) if (this.examActive(i)) cols.push(i);\n    const head = ['座號', '姓名'].concat(cols.map(i => {\n      const d = w.defs[i] || {};\n      return [d.date, d.name].filter(Boolean).join(' ') || ('第 ' + (i + 1) + ' 次');\n    }), ['個人平均']);\n    const rows = this.students.map(s => {\n      const vals = cols.map(i => { const v = (w.sc[s.id] || {})[i]; return typeof v === 'number' ? v : ''; });\n      const nums = vals.filter(v => v !== '');\n      return [String(s.no).padStart(2, '0'), s.name].concat(vals, [nums.length ? Math.round(nums.reduce((a, b) => a + b, 0) / nums.length * 10) / 10 : '']);\n    });\n    const mean = ['班級平均', ''].concat(cols.map(i => this.examMean(i) === null ? '' : this.examMean(i)), ['']);\n    const med = ['中位數', ''].concat(cols.map(i => this.examMedian(i) === null ? '' : this.examMedian(i)), ['']);\n    const esc = v => /[\",\\n]/.test(String(v)) ? '\"' + String(v).replace(/\"/g, '\"\"') + '\"' : String(v);\n    return [head].concat(rows, [mean], [med]).map(r => r.map(esc).join(',')).join('\\n');\n  }\n  downloadExamCsv() {\n    try {\n      const blob = new Blob(['\\ufeff' + this.examCsv()], { type: 'text/csv;charset=utf-8' });\n      const a = document.createElement('a');\n      a.href = URL.createObjectURL(blob);\n      a.download = '814週考成績_' + this.weekKey() + '.csv';\n      document.body.appendChild(a);\n      a.click();\n      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);\n      this.flash('已匯出本週小考成績');\n    } catch (e) { this.flash('匯出失敗，請改用電腦瀏覽器'); }\n  }\n\n  // 段考成績：獨立儲存，不與日常紀錄連動\n  MID_KEY = 'cls814-mid-v1';\n  MID_SUBS = ['國文', '數學', '英語', '自然', '地理', '歷史', '公民'];\n  MID_NAMES = ['第一次段考', '第二次段考', '期末考'];\n  loadMid() {\n    try {\n      const raw = localStorage.getItem(this.MID_KEY);\n      if (raw) { const d = JSON.parse(raw); this.setState({ mid: d.mid || {}, midWhich: d.which || 0 }); }\n    } catch (e) {}\n  }\n  saveMid(mid, which) {\n    try { localStorage.setItem(this.MID_KEY, JSON.stringify({ mid, which: which === undefined ? (this.state.midWhich || 0) : which })); } catch (e) {}\n  }\n  midSc() { return ((this.state.mid || {})[this.state.midWhich || 0] || {}); }\n  setMidScore(sid, sub, v) {\n    const which = this.state.midWhich || 0;\n    const cur = this.midSc();\n    const row = Object.assign({}, cur[sid]);\n    const t = String(v).trim();\n    if (t === '') delete row[sub]; else row[sub] = Math.max(0, Math.min(100, Number(t)));\n    const next = Object.assign({}, this.state.mid, { [which]: Object.assign({}, cur, { [sid]: row }) });\n    this.setState({ mid: next });\n    this.saveMid(next);\n  }\n  midSum(sid) {\n    const r = this.midSc()[sid] || {};\n    const v = this.MID_SUBS.map(s => r[s]).filter(x => typeof x === 'number' && !isNaN(x));\n    return v.length ? { sum: v.reduce((a, b) => a + b, 0), n: v.length } : null;\n  }\n  midRanks() {\n    const arr = this.students.map(s => ({ id: s.id, t: (this.midSum(s.id) || {}).sum })).filter(x => typeof x.t === 'number');\n    arr.sort((a, b) => b.t - a.t);\n    const out = {};\n    arr.forEach((x, i) => { out[x.id] = i > 0 && arr[i - 1].t === x.t ? out[arr[i - 1].id] : i + 1; });\n    return out;\n  }\n  midCol(sub) {\n    const sc = this.midSc();\n    return this.students.map(s => (sc[s.id] || {})[sub]).filter(v => typeof v === 'number' && !isNaN(v));\n  }\n  midMean(sub) {\n    const v = this.midCol(sub);\n    return v.length ? Math.round((v.reduce((a, b) => a + b, 0) / v.length) * 10) / 10 : null;\n  }\n  midMedian(sub) {\n    const v = this.midCol(sub).slice().sort((a, b) => a - b);\n    if (!v.length) return null;\n    const m = Math.floor(v.length / 2);\n    return v.length % 2 ? v[m] : Math.round(((v[m - 1] + v[m]) / 2) * 10) / 10;\n  }\n  midCsv() {\n    const head = ['座號', '姓名'].concat(this.MID_SUBS, ['總分', '平均', '班排名']);\n    const rk = this.midRanks(), sc = this.midSc();\n    const rows = this.students.map(s => {\n      const r = sc[s.id] || {}, t = this.midSum(s.id);\n      return [String(s.no).padStart(2, '0'), s.name]\n        .concat(this.MID_SUBS.map(x => (typeof r[x] === 'number' ? r[x] : '')),\n          [t ? t.sum : '', t ? Math.round(t.sum / t.n * 10) / 10 : '', rk[s.id] || '']);\n    });\n    const mean = ['班級平均', ''].concat(this.MID_SUBS.map(x => this.midMean(x) === null ? '' : this.midMean(x)), ['', '', '']);\n    const med = ['中位數', ''].concat(this.MID_SUBS.map(x => this.midMedian(x) === null ? '' : this.midMedian(x)), ['', '', '']);\n    const esc = v => /[\",\\n]/.test(String(v)) ? '\"' + String(v).replace(/\"/g, '\"\"') + '\"' : String(v);\n    return [head].concat(rows, [mean], [med]).map(r => r.map(esc).join(',')).join('\\n');\n  }\n  downloadMidCsv() {\n    const csv = this.midCsv();\n    try {\n      const blob = new Blob(['\\ufeff' + csv], { type: 'text/csv;charset=utf-8' });\n      const a = document.createElement('a');\n      a.href = URL.createObjectURL(blob);\n      a.download = '814' + this.MID_NAMES[this.state.midWhich || 0] + '成績.csv';\n      document.body.appendChild(a);\n      a.click();\n      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);\n      this.flash('已匯出段考成績');\n    } catch (e) { this.flash('匯出失敗，請改用電腦瀏覽器'); }\n  }\n\n  // 週考成績：exams[週一日期] = { defs:[{date,name}×10], sc:{ 座號: {次序: 分數} } }\n  EXAM_N = 10;\n  examWeek() {\n    const e = (this.state.exams || {})[this.weekKey()] || {};\n    return { defs: e.defs || [], sc: e.sc || {} };\n  }\n  setExamWeek(next) {\n    const k = this.weekKey();\n    this.setState(s => ({ exams: Object.assign({}, s.exams, { [k]: next }) }));\n  }\n  setExamDef(i, field, v) {\n    const w = this.examWeek();\n    const defs = [];\n    for (let j = 0; j < this.EXAM_N; j++) defs[j
